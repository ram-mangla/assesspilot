[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assesspilot"
version = "1.0.0"
description = "Autonomous, self-learning browser assessment test harness and AI copilot for web exams. Built with Playwright, NVIDIA NIM, and OpenRouter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mangla", email = "manglaram69@gmail.com" }
]
keywords = [
    "playwright",
    "browser-automation",
    "assessment",
    "eval",
    "exam",
    "cli",
    "python",
    "self-learning",
    "ai-agent",
    "testing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "playwright>=1.45.0",
    "flask>=3.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
assesspilot = "quizagent.cli:main"
quizagent = "quizagent.cli:main"

[project.urls]
Homepage = "https://github.com/ram-mangla/assesspilot"
Repository = "https://github.com/ram-mangla/assesspilot"
Issues = "https://github.com/ram-mangla/assesspilot/issues"
Changelog = "https://github.com/ram-mangla/assesspilot/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["quizagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
