name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in AssessPilot"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it quickly.
  - type: input
    id: version
    attributes:
      label: AssessPilot Version
      description: What version of AssessPilot are you running? (Run `assesspilot --version`)
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10 / 11
        - macOS (Apple Silicon / Intel)
        - Linux (Ubuntu / Debian / Fedora / Arch)
    validations:
      required: true
  - type: dropdown
    id: browser_mode
    attributes:
      label: Browser Mode
      options:
        - Default Chromium (headed)
        - Headless Chromium
        - Remote Chrome via CDP (--cdp)
        - Persistent Chrome Profile (--profile)
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command or reproduction steps.
      placeholder: |
        1. Run `quizpilot run --url "..."`
        2. Observe error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Paste any doctor output (`quizpilot doctor`) or relevant trace logs.
      render: shell
